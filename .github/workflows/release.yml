name: Release verified package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: java tools/Build.java package
      - name: Check version and assemble distribution
        shell: bash
        run: |
          test "$(java -jar dist/rudy-classpath-0.1.0.jar --version)" = "classpath ${GITHUB_REF_NAME#v}"
          mkdir -p build/rudy-classpath-0.1.0
          cp dist/rudy-classpath-0.1.0.jar README.md LICENSE build/rudy-classpath-0.1.0/
          cp -R docs examples build/rudy-classpath-0.1.0/
          (cd build && zip -qr ../dist/rudy-classpath-0.1.0.zip rudy-classpath-0.1.0)
          (cd dist && sha256sum rudy-classpath-0.1.0.jar rudy-classpath-0.1.0.zip > SHA256SUMS.txt)
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Rudy Classpath $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
