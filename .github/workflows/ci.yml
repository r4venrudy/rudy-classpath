name: Verify Classpath
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile with warnings as errors and run regressions
        run: java tools/Build.java test
      - name: Build the standalone JAR
        run: java tools/Build.java package
      - name: Offline packaged examples
        shell: bash
        run: |
          java -jar dist/rudy-classpath-0.1.0.jar --version
          java -jar dist/rudy-classpath-0.1.0.jar scan --target 21 --fail-on none examples/library-a.jar examples/library-b.jar
          java -jar dist/rudy-classpath-0.1.0.jar explain demo.Version examples/library-a.jar
          java -jar dist/rudy-classpath-0.1.0.jar scan --target 17 examples/multi-release.jar
          java -jar dist/rudy-classpath-0.1.0.jar compare examples/before.classpath examples/after.classpath
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classpath-${{ matrix.os }}-java-${{ matrix.java }}
          path: dist/*.jar
